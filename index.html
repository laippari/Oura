<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Oura Ring 5 (Silver, titaani) – fysikaalisesti renderöity 3D-malli, WebGPU.">
  <title>Oura Ring 5</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: rgba(236, 234, 230, 0.86);
      --muted: rgba(236, 234, 230, 0.5);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      letter-spacing: 0.01em;
    }
    #viewer {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #loading span {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: rgba(255, 255, 255, 0.7);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.ready #loading { opacity: 0; }
    #hint {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(20, 20, 22, 0.55);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: var(--fg);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-size: 12px;
    }
    body.ready #hint { opacity: 1; }
    body.ready #hint.hidden { opacity: 0; }
    #hint b { font-weight: 600; }
    #hint i { font-style: normal; color: var(--muted); margin: 0 6px; }
    #backend {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: max(10px, env(safe-area-inset-top));
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(236, 234, 230, 0.28);
      pointer-events: none;
    }
    #error {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 40%;
      text-align: center;
      color: var(--fg);
    }
    @media (max-width: 380px) {
      #hint { font-size: 11px; padding: 8px 12px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <div id="loading"><span></span></div>
  <div id="hint"><b>Vedä</b> kierrä<i>·</i><b>Nipistä</b> zoomaa<i>·</i><b>2× napautus</b> palauta</div>
  <div id="backend"></div>
  <div id="error" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
