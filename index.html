<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0a">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Oura Ring 5 – virallisista tuotekuvista mitattu, fysikaalisesti renderöity 3D-malli kaikilla virallisilla väreillä. WebGPU.">
  <title>Oura Ring 5</title>
  <style>
    /* Vaalea tuotekuvausstudio. Käyttöliittymä: kierto/zoomaus sekä Ouran tyylinen alapaneeli. */
    :root {
      color-scheme: light;
      --bg: #d6d5d2;
      --fg: #1f1d1b;
      --muted: rgba(31, 29, 27, 0.5);
      --hair: rgba(31, 29, 27, 0.08);
      --chip: rgba(251, 249, 246, 0.66);
      --sheet: linear-gradient(180deg, rgba(251, 249, 246, 0.94), rgba(246, 242, 237, 0.96));
      --tile: rgba(31, 29, 27, 0.045);
      --sheet-solid: #f7f4f0;
      --tile-on: #1f1d1b;
      --tile-on-fg: #f7f4f0;
      --ring: rgba(31, 29, 27, 0.85);
      --shadow: 0 -10px 40px rgba(46, 36, 26, 0.14), 0 -1px 0 rgba(31, 29, 27, 0.04);
      --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
    }
    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0a0a;
      --fg: #eee9e2;
      --muted: rgba(238, 233, 226, 0.48);
      --hair: rgba(238, 233, 226, 0.08);
      --chip: rgba(36, 34, 31, 0.6);
      --sheet: linear-gradient(180deg, rgba(30, 28, 26, 0.93), rgba(22, 21, 19, 0.96));
      --tile: rgba(238, 233, 226, 0.06);
      --sheet-solid: #1b1a18;
      --tile-on: #eee9e2;
      --tile-on-fg: #1c1a18;
      --ring: rgba(238, 233, 226, 0.85);
      --shadow: 0 -10px 40px rgba(0, 0, 0, 0.5), 0 -1px 0 rgba(255, 255, 255, 0.04);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html:has(body[data-theme="dark"]) { background: #0b0a0a; }
    body {
      font: 400 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      letter-spacing: 0.005em;
      transition: background-color 0.5s ease;
    }
    button { font: inherit; color: inherit; }
    #viewer { position: fixed; inset: 0; touch-action: none; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity 0.6s ease; }
    #loading span {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--hair); border-top-color: var(--muted);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.ready #loading { opacity: 0; }

    /* teemanvaihdon pehmeä verho kanvaasin ja käyttöliittymän välissä */
    #veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s var(--ease); }
    #veil.on { opacity: 1; transition-duration: 0.22s; }

    /* --- alareunan pilleri ja vihje --- */
    #dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 16px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
    }
    body.ready #dock { opacity: 1; }
    #hint { font-size: 11.5px; color: var(--muted); white-space: nowrap; transition: opacity 0.8s ease; }
    #hint.hidden { opacity: 0; }
    #hint b { font-weight: 600; color: var(--fg); }
    #hint i { font-style: normal; margin: 0 5px; }
    #pill {
      pointer-events: auto; display: inline-flex; align-items: center; gap: 9px;
      height: 40px; padding: 0 14px 0 9px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--chip); color: var(--fg);
      -webkit-backdrop-filter: blur(18px) saturate(1.25); backdrop-filter: blur(18px) saturate(1.25);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 0 0 0.5px var(--hair);
      transition: transform 0.45s var(--ease), opacity 0.35s ease;
    }
    #pill .dot { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--sw-a) 0%, var(--sw-b) 78%); box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2); }
    #pill .name { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    #pill svg { width: 14px; height: 14px; opacity: 0.55; }
    body.sheet-open #pill, body.seq #pill { opacity: 0; transform: translateY(14px); pointer-events: none; }
    body.sheet-open #hint, body.seq #hint { opacity: 0; }

    /* --- alapaneeli --- */
    #sheet {
      position: fixed; left: 50%; bottom: 0; width: min(100%, 520px);
      transform: translate(-50%, 104%);
      box-sizing: border-box;
      padding: 8px 20px max(16px, env(safe-area-inset-bottom));
      border-radius: 26px 26px 0 0;
      background: var(--sheet);
      -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: var(--shadow);
      transition: transform 0.5s var(--ease), background 0.5s ease;
      touch-action: none;
    }
    body.sheet-open #sheet { transform: translate(-50%, 0); }
    #sheet.dragging { transition: none; }
    .grab { width: 36px; height: 4px; border-radius: 2px; margin: 0 auto 12px; background: var(--fg); opacity: 0.16; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 10px; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .value { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }

    #finishes { display: flex; justify-content: space-between; margin: 0 2px 18px; }
    #finishes button {
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      background: radial-gradient(circle at 32% 28%, var(--sw-a) 0%, var(--sw-b) 78%);
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18), 0 0 0 2px transparent;
      transition: box-shadow 0.25s ease, transform 0.25s var(--ease);
    }
    #finishes button.brushed {
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.18) 0 1px, rgba(0, 0, 0, 0.05) 1px 2px),
        radial-gradient(circle at 32% 28%, var(--sw-a) 0%, var(--sw-b) 78%);
    }
    #finishes button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--sheet-solid), inset 0 0 0 3.5px rgba(0, 0, 0, 0.12), 0 0 0 1.5px var(--ring); }
    #finishes button:active { transform: scale(0.8); }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .tile {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      height: 64px; padding: 11px 12px 10px; border: 0; border-radius: 16px; cursor: pointer;
      background: var(--tile); color: var(--fg); text-align: left;
      transition: background 0.3s ease, color 0.3s ease, transform 0.2s var(--ease);
    }
    .tile svg { width: 20px; height: 20px; }
    .tile span { font-size: 12px; font-weight: 500; letter-spacing: 0.01em; }
    .tile[aria-pressed="true"] { background: var(--tile-on); color: var(--tile-on-fg); }
    .tile:active { transform: scale(0.97); }

    .views { display: flex; justify-content: space-between; gap: 6px; margin: 0 -2px; }
    .views button {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px;
      padding: 0; border: 0; background: none; cursor: pointer;
    }
    .views .ico {
      width: 100%; max-width: 62px; height: 46px; border-radius: 14px; display: grid; place-items: center;
      background: var(--tile); transition: background 0.3s ease, transform 0.2s var(--ease);
    }
    .views svg { width: 22px; height: 22px; }
    .views span { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.01em; }
    .views button:active .ico { transform: scale(0.95); }
    svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

    /* --- tilarivit --- */
    #status {
      position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top));
      transform: translate(-50%, -8px); display: flex; align-items: center; gap: 8px;
      padding: 7px 13px 7px 11px; border-radius: 999px;
      background: var(--chip); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: inset 0 0 0 0.5px var(--hair);
      font-size: 11.5px; letter-spacing: 0.02em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease, transform 0.5s var(--ease);
    }
    #status.on { opacity: 1; transform: translate(-50%, 0); }
    #status .led { width: 7px; height: 7px; border-radius: 50%; background: var(--led, #2bd46a); box-shadow: 0 0 10px 1px var(--led, #2bd46a); }
    #status .sub { color: var(--muted); }
    #seqlabel {
      position: fixed; left: 50%; bottom: max(22px, calc(env(safe-area-inset-bottom) + 8px));
      transform: translate(-50%, 6px); font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.7s ease, transform 0.7s var(--ease);
    }
    #seqlabel b { color: var(--fg); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; margin-right: 8px; }
    #seqlabel.on { opacity: 1; transform: translate(-50%, 0); }

    #backend {
      position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); opacity: 0.6; pointer-events: none;
    }
    #error { position: fixed; left: 16px; right: 16px; top: 40%; text-align: center; color: var(--fg); }
    body.match #dock, body.match #sheet, body.match #status { display: none; }
    @media (max-width: 360px) {
      #sheet { padding-left: 14px; padding-right: 14px; }
      #finishes button { width: 30px; height: 30px; }
      .tile { height: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading span { animation: none; }
      #sheet, #pill, #status, #seqlabel { transition-duration: 0.01s; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body data-theme="dark">
  <div id="viewer"></div>
  <div id="loading"><span></span></div>
  <div id="veil"></div>

  <div id="status" aria-live="polite"><i class="led"></i><span id="status-text"></span><span class="sub" id="status-sub"></span></div>
  <div id="seqlabel"><b id="seqname"></b>napauta lopettaaksesi</div>

  <div id="dock">
    <div id="hint"><b>Vedä</b> kierrä<i>·</i><b>Nipistä</b> zoomaa<i>·</i><b>2× napautus</b> palauta</div>
    <button id="pill" type="button" aria-controls="sheet" aria-expanded="false">
      <i class="dot"></i><span class="name" id="pill-name">Silver</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </div>

  <section id="sheet" role="dialog" aria-label="Asetukset" aria-hidden="true">
    <div class="grab" aria-hidden="true"></div>
    <div class="head"><span class="label">Väri</span><span class="value" id="finish-name"></span></div>
    <div id="finishes" role="group" aria-label="Väri"></div>
    <div class="tiles">
      <button class="tile" id="tg-explode" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2"/><ellipse cx="12" cy="12" rx="7" ry="2"/><ellipse cx="12" cy="18.5" rx="7" ry="2"/></svg>
        <span>Räjäytys</span>
      </button>
      <button class="tile" id="tg-sensors" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h4.2l1.8-4.5 3 10 2.4-7.2 1.4 1.7h6.2"/></svg>
        <span>Sensorit</span>
      </button>
      <button class="tile" id="tg-dark" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" stroke="none"/></svg>
        <span>Tumma</span>
      </button>
    </div>
    <div class="head"><span class="label">Näkymät</span></div>
    <div class="views" id="views">
      <button type="button" data-seq="hero"><i class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12.5" rx="8" ry="4.2"/><path d="M8.2 5.2A9 9 0 0 1 18 7.3"/><path d="M18 4.6v2.7h-2.7"/></svg></i><span>Esittely</span></button>
      <button type="button" data-seq="sensor"><i class="ico"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></i><span>Sensori</span></button>
      <button type="button" data-seq="through"><i class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></i><span>Läpi</span></button>
      <button type="button" data-seq="profile"><i class="ico"><svg viewBox="0 0 24 24"><path d="M4 12c0-3.2 1.2-4 8-4s8 .8 8 4-1.2 4-8 4-8-.8-8-4z"/></svg></i><span>Profiili</span></button>
      <button type="button" data-seq="exploded"><i class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="4.5" rx="6" ry="1.6"/><ellipse cx="12" cy="9.5" rx="6" ry="1.6"/><ellipse cx="12" cy="14.5" rx="6" ry="1.6"/><ellipse cx="12" cy="19.5" rx="6" ry="1.6"/></svg></i><span>Räjäytys</span></button>
    </div>
  </section>

  <div id="backend"></div>
  <div id="error" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
