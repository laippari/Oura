<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0a">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Oura Ring 5 – a physically rendered 3D model measured from the official product images, in all official finishes. WebGPU.">
  <title>Oura Ring 5</title>
  <style>
    /* Vaalea tuotekuvausstudio. Käyttöliittymä: kierto/zoomaus sekä Ouran tyylinen alapaneeli. */
    :root {
      color-scheme: light;
      --bg: #d6d5d2;
      --fg: #1f1d1b;
      --muted: rgba(31, 29, 27, 0.5);
      --hair: rgba(31, 29, 27, 0.08);
      --chip: rgba(251, 249, 246, 0.66);
      --sheet: rgba(250, 248, 245, 0.74);
      --sheet-edge: rgba(255, 255, 255, 0.6);
      --tile: rgba(31, 29, 27, 0.07); /* resting: a little darker than the card */
      --tile-on: rgba(255, 255, 255, 0.72); /* active: lifted */
      --ring: rgba(31, 29, 27, 0.85);
      --shadow: 0 18px 50px rgba(46, 36, 26, 0.2), 0 2px 8px rgba(46, 36, 26, 0.08);
      --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
      --spring: cubic-bezier(0.2, 0.9, 0.25, 1.12);
    }
    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0a0a;
      --fg: #eee9e2;
      --muted: rgba(238, 233, 226, 0.48);
      --hair: rgba(238, 233, 226, 0.08);
      --chip: rgba(36, 34, 31, 0.6);
      --sheet: rgba(34, 32, 29, 0.62);
      --sheet-edge: rgba(255, 255, 255, 0.07);
      --tile: rgba(0, 0, 0, 0.24);
      --tile-on: rgba(238, 233, 226, 0.1);
      --ring: rgba(238, 233, 226, 0.85);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html:has(body[data-theme="dark"]) { background: #0b0a0a; }
    body {
      font: 400 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      letter-spacing: 0.005em;
      transition: background-color 0.5s ease;
    }
    button { font: inherit; color: inherit; }
    #viewer { position: fixed; inset: 0; touch-action: none; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity 0.6s ease; }
    #loading span {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--hair); border-top-color: var(--muted);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.ready #loading { opacity: 0; }

    /* --- alareunan pilleri ja vihje --- */
    #dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 16px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
    }
    body.ready #dock { opacity: 1; }
    #hint { font-size: 11.5px; color: var(--muted); white-space: nowrap; transition: opacity 0.8s ease; }
    #hint.hidden { opacity: 0; }
    #hint b { font-weight: 600; color: var(--fg); }
    #hint i { font-style: normal; margin: 0 5px; }
    #pill {
      pointer-events: auto; display: inline-flex; align-items: center; gap: 9px;
      height: 40px; padding: 0 14px 0 9px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--chip); color: var(--fg);
      -webkit-backdrop-filter: blur(18px) saturate(1.25); backdrop-filter: blur(18px) saturate(1.25);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 0 0 0.5px var(--hair);
      transition: transform 0.45s var(--ease), opacity 0.35s ease;
    }
    #pill .dot { width: 26px; height: 21px; border-radius: 50%; background: radial-gradient(ellipse at 40% 30%, var(--sw-a) 0%, var(--sw-b) 80%) center / 100% 100% no-repeat; }
    #pill .name { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    #pill svg { width: 14px; height: 14px; opacity: 0.55; }
    /* during a tour the pill stays within reach, quieter and lifted clear of the progress line */
    body.seq #pill { opacity: 0.5; transform: translateY(-16px); }
    body.sheet-open #pill { opacity: 0; transform: translateY(14px); pointer-events: none; }
    body.sheet-open #hint, body.seq #hint { opacity: 0; }

    /* --- settings card: floats above the scene, opens with a small spring --- */
    #sheet {
      position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 420px);
      box-sizing: border-box;
      padding: 8px 16px 16px;
      border-radius: 28px;
      background: var(--sheet);
      -webkit-backdrop-filter: blur(26px) saturate(1.25); backdrop-filter: blur(26px) saturate(1.25);
      box-shadow: var(--shadow), inset 0 0 0 0.5px var(--sheet-edge);
      transform: translate(-50%, 26px) scale(0.94); transform-origin: 50% 100%;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: transform 0.36s var(--ease), opacity 0.24s ease, visibility 0s linear 0.36s, background 0.5s ease;
      touch-action: none;
    }
    body.sheet-open #sheet {
      transform: translate(-50%, 0) scale(1); opacity: 1; visibility: visible; pointer-events: auto;
      transition: transform 0.6s var(--spring), opacity 0.3s ease, visibility 0s, background 0.5s ease;
    }
    #sheet.dragging { transition: none; }
    /* content rises in after the card, one row at a time */
    #sheet > * { opacity: 0; transform: translateY(8px); transition: opacity 0.2s ease, transform 0.2s ease; }
    body.sheet-open #sheet > * {
      opacity: 1; transform: none;
      transition: opacity 0.45s ease calc(var(--row, 0) * 45ms + 90ms), transform 0.55s var(--ease) calc(var(--row, 0) * 45ms + 90ms);
    }
    .grab { width: 34px; height: 4px; border-radius: 2px; margin: 0 auto 12px; background: var(--fg); }
    body.sheet-open #sheet > .grab { opacity: 0.16; }
    .head { display: flex; justify-content: center; align-items: baseline; gap: 8px; margin: 0 0 10px; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .value { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }

    /* finish swatches: pebbles rendered with the real frame material (see main.js) */
    #finishes { display: flex; justify-content: center; gap: 9px; margin: 0 0 14px; }
    #finishes button {
      width: 46px; height: 37.5px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; flex: none;
      background: radial-gradient(ellipse at 40% 30%, var(--sw-a) 0%, var(--sw-b) 80%) center / 100% 100% no-repeat;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.32));
      outline: 1.5px solid transparent; outline-offset: 2px;
      transform: scale(0.72);
      transition: transform 0.25s var(--ease), outline-color 0.25s ease;
    }
    body.sheet-open #finishes button {
      transform: scale(1);
      transition: transform 0.7s var(--spring) calc(var(--i, 0) * 40ms + 140ms), outline-color 0.25s ease;
    }
    #finishes button[aria-pressed="true"] { outline-color: var(--ring); }
    body.sheet-open #finishes button:active { transform: scale(0.9); transition-delay: 0s; transition-duration: 0.15s; }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .head { margin-bottom: 9px; }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      height: 54px; padding: 0 8px; border: 0; border-radius: 16px; cursor: pointer;
      background: var(--tile); color: var(--fg);
      transition: background 0.3s ease, transform 0.2s var(--ease);
    }
    .tile > * { opacity: 0.5; transition: opacity 0.3s ease; }
    .tile svg { width: 19px; height: 19px; }
    .tile span { font-size: 11.5px; font-weight: 500; letter-spacing: 0.01em; }
    .tile[aria-pressed="true"] { background: var(--tile-on); }
    .tile[aria-pressed="true"] > * { opacity: 1; }
    .tile:active { transform: scale(0.97); }

    .views { display: flex; justify-content: center; gap: 8px; }
    .views button {
      flex: 1 1 0; max-width: 64px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 0; border: 0; background: none; cursor: pointer; color: var(--fg);
    }
    .views .ico {
      width: 100%; height: 44px; border-radius: 14px; display: grid; place-items: center;
      background: var(--tile); transition: background 0.3s ease, transform 0.2s var(--ease);
    }
    .views svg { width: 21px; height: 21px; opacity: 0.55; transition: opacity 0.3s ease; }
    .views span { font-size: 11px; font-weight: 500; opacity: 0.5; letter-spacing: 0.01em; transition: opacity 0.3s ease; }
    .views button:active .ico { transform: scale(0.95); background: var(--tile-on); }
    .views button:active svg, .views button:active span { opacity: 1; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

    /* --- ajon nimi --- */
    #seqlabel {
      position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px);
      transform: translate(-50%, 6px); font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.7s ease, transform 0.7s var(--ease);
    }
    #seqlabel b { color: var(--fg); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; margin-right: 8px; }
    #seqlabel.on { opacity: 1; transform: translate(-50%, 0); }
    body.sheet-open #seqlabel, body.sheet-open #progress { opacity: 0; }

    #credit {
      position: fixed; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
      font-size: 10.5px; line-height: 1.5; letter-spacing: 0.03em; text-align: right; color: var(--muted);
      pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
    }
    #credit a { color: var(--fg); opacity: 0.75; text-decoration: none; pointer-events: auto; }
    body.ready #credit { opacity: 1; }
    body.match #credit { display: none; }
    /* showcase progress: a hairline that fills over one loop */
    #progress {
      position: fixed; left: 50%; bottom: max(14px, calc(env(safe-area-inset-bottom) + 2px));
      width: 112px; height: 2px; margin-left: -56px; border-radius: 1px; overflow: hidden;
      background: var(--hair); opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
    }
    #progress i { display: block; height: 100%; width: 100%; background: var(--fg); opacity: 0.7; transform-origin: 0 50%; transform: scaleX(0); }
    #progress.on { opacity: 1; }
    #error { position: fixed; left: 16px; right: 16px; top: 40%; text-align: center; color: var(--fg); }
    body.match #dock, body.match #sheet { display: none; }
    @media (max-width: 370px) {
      #sheet { padding-left: 12px; padding-right: 12px; }
      #finishes { gap: 6px; }
      #finishes button { width: 41px; height: 33.5px; }
      .views { gap: 5px; }
      .views span { font-size: 10.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading span { animation: none; }
      #sheet, #pill, #seqlabel { transition-duration: 0.01s; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body data-theme="dark">
  <div id="viewer"></div>
  <div id="loading"><span></span></div>

  <div id="seqlabel"><b id="seqname"></b>tap to stop</div>
  <div id="progress" aria-hidden="true"><i></i></div>

  <div id="dock">
    <div id="hint"><b>Drag</b> to rotate<i>·</i><b>Pinch</b> to zoom<i>·</i><b>Double-tap</b> to reset</div>
    <button id="pill" type="button" aria-controls="sheet" aria-expanded="false">
      <i class="dot"></i><span class="name" id="pill-name">Silver</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </div>

  <section id="sheet" role="dialog" aria-label="Settings" aria-hidden="true">
    <div class="grab" aria-hidden="true" style="--row:0"></div>
    <div class="head" style="--row:0"><span class="label">Finish</span><span class="value" id="finish-name"></span></div>
    <div id="finishes" role="group" aria-label="Finish" style="--row:1"></div>
    <div class="head" style="--row:2"><span class="label">Display</span></div>
    <div class="tiles" style="--row:3">
      <button class="tile" id="tg-explode" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2"/><ellipse cx="12" cy="12" rx="7" ry="2"/><ellipse cx="12" cy="18.5" rx="7" ry="2"/></svg>
        <span>Explode</span>
      </button>
      <button class="tile" id="tg-sensors" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h4.2l1.8-4.5 3 10 2.4-7.2 1.4 1.7h6.2"/></svg>
        <span>Sensors</span>
      </button>
      <button class="tile" id="tg-dark" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" stroke="none"/></svg>
        <span>Dark</span>
      </button>
    </div>
    <div class="head" style="--row:4"><span class="label">Views</span></div>
    <div class="views" id="views" style="--row:5">
      <button type="button" data-seq="signature"><i class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12.5" rx="8" ry="4.2"/><path d="M8.2 5.2A9 9 0 0 1 18 7.3"/><path d="M18 4.6v2.7h-2.7"/></svg></i><span>Signature</span></button>
      <button type="button" data-seq="horizon"><i class="ico"><svg viewBox="0 0 24 24"><path d="M3 17.2c4.2-3.4 13.8-3.4 18 0"/><circle cx="12" cy="9.2" r="2.3"/></svg></i><span>Horizon</span></button>
      <button type="button" data-seq="anatomy"><i class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6.6" rx="7" ry="2.2"/><ellipse cx="12" cy="17.4" rx="7" ry="2.2"/><path d="M12 10.4v3.2"/></svg></i><span>Anatomy</span></button>
      <button type="button" data-seq="halo"><i class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6"/><circle cx="12" cy="16.4" r="1.2" fill="currentColor" stroke="none"/></svg></i><span>Halo</span></button>
      <button type="button" data-seq="odyssey"><i class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.2" ry="3.9" transform="rotate(-24 12 12)"/><circle cx="12" cy="12" r="2.2"/></svg></i><span>Odyssey</span></button>
    </div>
  </section>

  <div id="credit">Experience crafted by<br><a href="mailto:ville.laiho@futurice.com">ville.laiho@futurice.com</a></div>
  <div id="error" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
